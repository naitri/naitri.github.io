<section class="section highlights-section" id="news" aria-labelledby="news-title">
  <div class="container">
    <div class="compact-heading reveal">
      <div><p class="eyebrow dark">{{ site.data.site.sections.news.eyebrow }}</p><h2 id="news-title">{{ site.data.site.sections.news.title }}</h2></div>
      <div class="news-heading-actions"><div class="news-scroll-controls" aria-label="Scroll news"><button type="button" class="news-scroll-button" data-news-scroll="prev" aria-label="Previous news">←</button><button type="button" class="news-scroll-button" data-news-scroll="next" aria-label="Next news">→</button></div><a class="text-link dark-link" href="{{ '/news.html' | relative_url }}">All news ↗</a></div>
    </div>
    <div class="news-grid" id="news-strip" tabindex="0" aria-label="Recent news and recognition">
      <div class="news-track">
      {% assign news_items = site.news | sort: 'order' %}
      {% for item in news_items limit:6 %}
      <a class="news-card reveal{% cycle '', ' reveal-delay-1', ' reveal-delay-2' %}" href="{{ '/news.html' | relative_url }}#{{ item.anchor }}">
        <div class="news-image"><img src="{{ item.image }}" alt="{{ item.image_alt }}"></div>
        <div class="news-copy"><span class="signal-kicker">{{ item.kicker }}</span><h3>{{ item.home_title | default: item.title }}</h3><p>{{ item.home_summary }}</p></div>
      </a>
      {% endfor %}
      </div>
    </div>
  </div>
</section>
