<header class="site-header{% if page.header_light %} teaching-header{% endif %}">
  <div class="nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.site.name }} home"{% if page.nav_active %} data-brand-page="{{ page.nav_active | capitalize }}"{% endif %}><span class="brand-mark" data-brand-default="{{ site.data.site.initials }}">{{ site.data.site.initials }}</span></a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}#research">Research</a>
      <a href="{{ '/' | relative_url }}#publications">Publications</a>
      <a{% if page.nav_active == 'news' %} class="active"{% endif %} href="{{ '/news.html' | relative_url }}">News</a>
      <a href="{{ '/' | relative_url }}#experience">Experience</a>
      <a{% if page.nav_active == 'teaching' %} class="active"{% endif %} href="{{ '/teaching.html' | relative_url }}">Teaching</a>
    </nav>
    <div class="nav-end">
      {% include theme-toggle.html %}
      <a class="nav-cta" href="{{ site.data.site.links.cv }}">CV ↗</a>
    </div>
  </div>
</header>
